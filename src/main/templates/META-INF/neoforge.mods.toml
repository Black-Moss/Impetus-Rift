license = "${mod_license}"
issueTrackerURL = "https://github.com/Black-Moss/Impetus-Rift/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}"
description = "${mod_description}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/impetus-rift"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "thaumaturge"
type = "required"
versionRange = "[${thaumaturge_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "thaumaturgeadditions"
type = "optional"
versionRange = "[${thaumaturge_additions_version},)"
ordering = "NONE"
side = "BOTH"